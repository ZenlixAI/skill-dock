<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Registry Web UI Prototype</title>
    <style>
      :root {
        --bg: #f5efe2;
        --panel: rgba(255, 252, 245, 0.84);
        --panel-strong: #fffaf0;
        --border: rgba(50, 34, 18, 0.12);
        --text: #21170d;
        --muted: #66584c;
        --accent: #b95f2d;
        --accent-soft: rgba(185, 95, 45, 0.14);
        --success: #2f7d5a;
        --warning: #b76a06;
        --danger: #b13e2f;
        --shadow: 0 18px 60px rgba(28, 17, 10, 0.12);
        --radius: 26px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% 15%, rgba(225, 170, 118, 0.28), transparent 28%),
          radial-gradient(circle at 88% 10%, rgba(87, 152, 145, 0.18), transparent 24%),
          linear-gradient(180deg, #f8f3e8 0%, #f3ead8 100%);
        color: var(--text);
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      }

      a {
        color: inherit;
      }

      .shell {
        max-width: 1480px;
        margin: 0 auto;
        padding: 28px 24px 120px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 22px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-mark {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-weight: 700;
        letter-spacing: 0.08em;
        background: linear-gradient(135deg, rgba(185, 95, 45, 0.92), rgba(94, 45, 119, 0.82));
        color: #fffaf5;
        box-shadow: var(--shadow);
      }

      .brand h1 {
        margin: 0;
        font-size: 1.45rem;
        line-height: 1;
      }

      .brand p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .screen-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .screen-link {
        padding: 10px 14px;
        border-radius: 999px;
        text-decoration: none;
        color: var(--muted);
        border: 1px solid transparent;
        transition: 160ms ease;
      }

      .screen-link.active {
        color: var(--text);
        background: var(--panel);
        border-color: var(--border);
        box-shadow: 0 8px 24px rgba(31, 16, 8, 0.06);
      }

      .hero {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 18px;
        margin-bottom: 20px;
      }

      .card {
        background: var(--panel);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .hero-copy {
        padding: 26px 28px;
      }

      .eyebrow {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.86rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .hero-copy h2 {
        margin: 18px 0 10px;
        font-size: 2.8rem;
        line-height: 0.95;
      }

      .hero-copy p {
        margin: 0;
        max-width: 56ch;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.6;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      .button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font: inherit;
        cursor: pointer;
      }

      .button.primary {
        background: var(--text);
        color: #fff9f2;
      }

      .button.secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }

      .hero-side {
        padding: 22px;
        display: grid;
        gap: 14px;
      }

      .mini-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .mini-stat {
        padding: 16px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.64);
        border: 1px solid rgba(34, 22, 10, 0.08);
      }

      .mini-stat strong {
        display: block;
        font-size: 1.6rem;
      }

      .mini-stat span {
        color: var(--muted);
        font-size: 0.94rem;
      }

      .content {
        display: grid;
        gap: 18px;
      }

      .grid-two {
        display: grid;
        grid-template-columns: 1.35fr 0.95fr;
        gap: 18px;
      }

      .section {
        padding: 20px 22px;
      }

      .section h3 {
        margin: 0 0 14px;
        font-size: 1.2rem;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 14px;
      }

      .section-header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .list-row {
        padding: 14px 16px;
        border: 1px solid rgba(33, 23, 13, 0.09);
        background: rgba(255, 255, 255, 0.6);
        border-radius: 18px;
      }

      .list-row-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 6px;
      }

      .list-row-head strong {
        font-size: 1rem;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.05);
        color: var(--muted);
        font-size: 0.84rem;
      }

      .chip.good {
        background: rgba(47, 125, 90, 0.12);
        color: var(--success);
      }

      .chip.warn {
        background: rgba(183, 106, 6, 0.13);
        color: var(--warning);
      }

      .chip.bad {
        background: rgba(177, 62, 47, 0.13);
        color: var(--danger);
      }

      .chip.accent {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .inline-kpis {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .kpi {
        padding: 16px;
        border-radius: 20px;
        border: 1px solid rgba(33, 23, 13, 0.08);
        background: rgba(255, 255, 255, 0.58);
      }

      .kpi strong {
        display: block;
        font-size: 1.6rem;
      }

      .kpi span {
        color: var(--muted);
      }

      .import-grid {
        display: grid;
        grid-template-columns: 0.88fr 1.12fr;
        gap: 18px;
      }

      .steps {
        display: grid;
        gap: 12px;
      }

      .step {
        padding: 14px 15px;
        border-radius: 18px;
        border: 1px solid rgba(33, 23, 13, 0.08);
        background: rgba(255, 255, 255, 0.55);
      }

      .step.active {
        border-color: rgba(185, 95, 45, 0.28);
        background: rgba(185, 95, 45, 0.1);
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .warning-card {
        padding: 14px 15px;
        border-radius: 18px;
        border: 1px solid rgba(183, 106, 6, 0.18);
        background: rgba(255, 248, 233, 0.88);
      }

      .warning-card h4 {
        margin: 8px 0 6px;
        font-size: 1rem;
      }

      .warning-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 18px;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
      }

      .table td {
        padding: 10px 0;
        border-bottom: 1px solid rgba(33, 23, 13, 0.08);
        vertical-align: top;
      }

      .table td:first-child {
        width: 34%;
        color: var(--muted);
      }

      .timeline {
        display: grid;
        gap: 14px;
      }

      .timeline-item {
        padding-left: 16px;
        border-left: 2px solid rgba(185, 95, 45, 0.28);
      }

      .timeline-item strong {
        display: block;
        margin-bottom: 4px;
      }

      .timeline-item span {
        color: var(--muted);
      }

      .bottom-switcher {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(22, 15, 10, 0.9);
        color: #fff7ec;
        border-radius: 999px;
        padding: 10px 12px;
        box-shadow: 0 20px 45px rgba(10, 7, 4, 0.36);
        z-index: 20;
      }

      .switcher-btn {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        border: 0;
        background: rgba(255, 255, 255, 0.1);
        color: inherit;
        cursor: pointer;
        font-size: 1.05rem;
      }

      .switcher-label {
        min-width: 170px;
        text-align: center;
      }

      .switcher-label small {
        display: block;
        color: rgba(255, 247, 236, 0.74);
      }

      .variant-control .brand-mark {
        background: linear-gradient(135deg, #b95f2d, #40261b);
      }

      .variant-control .hero-copy h2 {
        font-size: 3rem;
      }

      .variant-studio {
        --bg: #edf6f0;
        --panel: rgba(248, 255, 251, 0.82);
        --panel-strong: #fbfffd;
        --border: rgba(12, 56, 43, 0.1);
        --text: #14382c;
        --muted: #56736a;
        --accent: #15836b;
        --accent-soft: rgba(21, 131, 107, 0.12);
        --shadow: 0 18px 55px rgba(7, 38, 30, 0.12);
        background:
          radial-gradient(circle at 12% 12%, rgba(21, 131, 107, 0.18), transparent 24%),
          radial-gradient(circle at 86% 14%, rgba(14, 87, 138, 0.16), transparent 22%),
          linear-gradient(180deg, #f3fbf6 0%, #e8f4ee 100%);
      }

      .variant-studio .brand-mark {
        background: linear-gradient(135deg, #0f7f68, #0c5c7a);
      }

      .variant-studio .hero {
        grid-template-columns: 0.88fr 1.12fr;
      }

      .variant-studio .hero-copy {
        border-right: 1px solid rgba(12, 56, 43, 0.08);
      }

      .variant-studio .import-grid {
        grid-template-columns: 0.62fr 1.38fr;
      }

      .variant-studio .step.active {
        background: rgba(21, 131, 107, 0.11);
        border-color: rgba(21, 131, 107, 0.25);
      }

      .variant-gallery {
        --bg: #f6f7fb;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-strong: #ffffff;
        --border: rgba(17, 26, 61, 0.1);
        --text: #14213b;
        --muted: #66728f;
        --accent: #e05b45;
        --accent-soft: rgba(224, 91, 69, 0.12);
        --shadow: 0 22px 62px rgba(20, 33, 59, 0.12);
        background:
          radial-gradient(circle at 18% 14%, rgba(224, 91, 69, 0.18), transparent 23%),
          radial-gradient(circle at 90% 8%, rgba(68, 117, 213, 0.18), transparent 22%),
          linear-gradient(180deg, #fbfcff 0%, #eef2fb 100%);
        font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      }

      .variant-gallery .brand-mark {
        background: linear-gradient(135deg, #e05b45, #4563c8);
      }

      .variant-gallery .hero {
        grid-template-columns: 1fr;
      }

      .variant-gallery .hero-side {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .variant-gallery .grid-two,
      .variant-gallery .detail-grid,
      .variant-gallery .import-grid {
        grid-template-columns: 1fr;
      }

      @media (max-width: 1100px) {
        .hero,
        .grid-two,
        .detail-grid,
        .import-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 760px) {
        .shell {
          padding-inline: 14px;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .hero-copy h2 {
          font-size: 2.2rem;
        }

        .mini-grid,
        .inline-kpis {
          grid-template-columns: 1fr;
        }

        .bottom-switcher {
          width: calc(100% - 20px);
          justify-content: space-between;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      const variants = [
        {
          key: "control",
          label: "A",
          name: "Control Room",
          bodyClass: "variant-control",
          heroEyebrow: "Dense operations console",
          heroTitle: "把 Catalog、Packaging、治理动作放进一个高密度控制台。",
          heroCopy:
            "面向平台团队和 publisher。优先暴露状态、风险、版本和导入改写结果，而不是做成轻飘飘的营销风目录。",
        },
        {
          key: "studio",
          label: "B",
          name: "Workflow Studio",
          bodyClass: "variant-studio",
          heroEyebrow: "Workflow-first studio",
          heroTitle: "把 prepare → validate → pack 做成真正可操作的导入工作台。",
          heroCopy:
            "面向频繁导入、改写和发布的 publisher。重心不是浏览，而是把输入、warning、import report 和发布确认串成一条顺手的流程。",
        },
        {
          key: "gallery",
          label: "C",
          name: "Gallery Market",
          bodyClass: "variant-gallery",
          heroEyebrow: "Reader-first catalog",
          heroTitle: "先让人愿意浏览，再让人看懂 install target 和治理状态。",
          heroCopy:
            "面向 reader 和业务侧用户。Catalog 更像产品库，细节通过右侧上下文和版本页补齐，不把每个列表项都做成工具后台表格。",
        },
      ];

      const screens = [
        { key: "overview", label: "Overview" },
        { key: "catalog", label: "Catalog" },
        { key: "import", label: "Import & Package" },
        { key: "detail", label: "Skill Detail" },
        { key: "audit", label: "Governance & Audit" },
      ];

      const data = {
        stats: [
          { value: "184", label: "Indexed skills" },
          { value: "26", label: "Imported this week" },
          { value: "9", label: "Normalization warnings" },
          { value: "3", label: "Governance actions today" },
        ],
        curated: [
          {
            name: "@platform.skill/pdf-skill",
            title: "PDF Skill",
            desc: "OCR + extraction + post-processing workflow",
            chips: ["imported", "latest 1.2.0", "published"],
          },
          {
            name: "@platform.skill/code-review",
            title: "Code Review",
            desc: "Review heuristics and checklist pack",
            chips: ["platform_authoring", "latest 0.8.4", "published"],
          },
          {
            name: "@platform.skill/web-scrape",
            title: "Web Scrape",
            desc: "Structured website collection workflow",
            chips: ["git", "latest 2.0.1", "deprecated"],
          },
        ],
        warnings: [
          {
            severity: "warning",
            title: "Generated placeholder capability content",
            code: "normalized_missing_capability_content",
            message:
              "Imported source lacked commands/, scripts/, docs/ or manifest files, so the packager inserted docs/README.md to keep the bundle publishable.",
            action: "Replace the placeholder with real capability content before treating this source as the long-term upstream truth.",
          },
          {
            severity: "warning",
            title: "Rewrote package identity",
            code: "normalized_rewrote_package_json_identity",
            message:
              "The upstream package.json declared a different name/version, so the internal target identity was rewritten during prepare.",
            action: "Confirm that the internal package mapping is intentional and document it in the import audit trail.",
          },
        ],
        importReport: {
          sourceType: "git",
          strictMode: false,
          normalized: true,
          generatedPaths: ["package.json", "docs/README.md"],
          rewrotePackageIdentity: true,
        },
        versions: [
          { version: "1.2.0", status: "published", policy: "resolvable", time: "2026-06-02 20:14 UTC" },
          { version: "1.1.1", status: "published", policy: "resolvable", time: "2026-05-27 09:42 UTC" },
          { version: "1.0.0", status: "deprecated", policy: "resolvable", time: "2026-05-14 04:18 UTC" },
        ],
        governance: [
          { title: "Yanked @platform.skill/web-scrape 1.9.0", meta: "security issue · svc-publisher · 1h ago" },
          { title: "Retired @platform.skill/legacy-diff", meta: "merged into new package · user_214 · 4h ago" },
          { title: "Deprecated @platform.skill/pdf-skill 1.0.0", meta: "replacement 1.2.0 · svc-publisher · yesterday" },
        ],
        audit: [
          { title: "release.record", meta: "svc-publisher · 201 · /api/v1/skills/.../release-record" },
          { title: "packaging.prepare", meta: "publisher role · 200 · imported git source" },
          { title: "governance.version.yank", meta: "svc-publisher · 201 · reason=security issue" },
        ],
      };

      function getState() {
        const params = new URLSearchParams(window.location.search);
        const variant = variants.find((item) => item.key === params.get("variant")) || variants[0];
        const screen = screens.find((item) => item.key === params.get("screen")) || screens[0];
        return { params, variant, screen };
      }

      function setParams(patch) {
        const params = new URLSearchParams(window.location.search);
        Object.entries(patch).forEach(([key, value]) => params.set(key, value));
        window.history.replaceState({}, "", `${window.location.pathname}?${params.toString()}`);
        render();
      }

      function chipClass(label) {
        if (label.includes("published") || label.includes("resolvable")) return "chip good";
        if (label.includes("deprecated") || label.includes("warning")) return "chip warn";
        if (label.includes("yanked") || label.includes("retired")) return "chip bad";
        return "chip accent";
      }

      function listRow(item) {
        return `
          <div class="list-row">
            <div class="list-row-head">
              <strong>${item.title}</strong>
              <span class="${chipClass(item.chips?.[2] || item.status || "")}">${item.chips?.[2] || item.status || "active"}</span>
            </div>
            <div>${item.name ? `<div>${item.name}</div>` : ""}</div>
            <div style="color: var(--muted); margin-top: 6px;">${item.desc || item.meta || ""}</div>
            ${item.chips ? `<div class="meta">${item.chips.map((chip) => `<span class="${chipClass(chip)}">${chip}</span>`).join("")}</div>` : ""}
          </div>
        `;
      }

      function renderOverview() {
        return `
          <div class="grid-two">
            <section class="card section">
              <div class="section-header">
                <div>
                  <h3>Curated Skills</h3>
                  <p>Reader 的主入口先看 curated，再进入具体 package 与 version 细节。</p>
                </div>
                <button class="button secondary">Open catalog</button>
              </div>
              <div class="list">${data.curated.map(listRow).join("")}</div>
            </section>
            <section class="card section">
              <div class="section-header">
                <div>
                  <h3>Latest Signals</h3>
                  <p>不做空心大屏，用真实治理和审计事件做 overview。</p>
                </div>
              </div>
              <div class="stack">
                <div class="card" style="padding: 14px 16px; background: rgba(255,255,255,0.48); box-shadow: none;">
                  <strong>Recent governance changes</strong>
                  <div class="list" style="margin-top: 12px;">${data.governance.map((item) => listRow(item)).join("")}</div>
                </div>
                <div class="card" style="padding: 14px 16px; background: rgba(255,255,255,0.48); box-shadow: none;">
                  <strong>Recent audit events</strong>
                  <div class="list" style="margin-top: 12px;">${data.audit.map((item) => listRow(item)).join("")}</div>
                </div>
              </div>
            </section>
          </div>
        `;
      }

      function renderCatalog() {
        return `
          <div class="grid-two">
            <section class="card section">
              <div class="section-header">
                <div>
                  <h3>Catalog Results</h3>
                  <p>搜索、sourceType、status 和 latestVersionStatus 都应在列表层可见。</p>
                </div>
                <div class="chip accent">GET /api/v1/skills</div>
              </div>
              <div class="card" style="padding: 14px 16px; background: rgba(255,255,255,0.44); box-shadow: none; margin-bottom: 14px;">
                <strong>Search</strong>
                <div style="margin-top: 10px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--border); color: var(--muted);">
                  q = "pdf", sourceType = imported, status = active
                </div>
              </div>
              <div class="list">${data.curated.concat(data.curated).slice(0, 5).map(listRow).join("")}</div>
            </section>
            <section class="card section">
              <div class="section-header">
                <div>
                  <h3>Context Drawer</h3>
                  <p>右侧永远回答“这个 skill 值不值得点进去”。</p>
                </div>
              </div>
              <div class="stack">
                <div class="card" style="padding: 16px; background: rgba(255,255,255,0.56); box-shadow: none;">
                  <div class="eyebrow">@platform.skill/pdf-skill</div>
                  <h3 style="margin-top: 16px;">PDF Skill</h3>
                  <p style="color: var(--muted);">OCR + extraction + post-processing workflow</p>
                  <div class="meta">
                    <span class="chip accent">imported</span>
                    <span class="chip good">latest 1.2.0</span>
                    <span class="chip good">published</span>
                  </div>
                </div>
                <div class="card" style="padding: 16px; background: rgba(255,255,255,0.56); box-shadow: none;">
                  <strong>Install target preview</strong>
                  <table class="table">
                    <tr><td>registry</td><td>https://npm.internal.example.com</td></tr>
                    <tr><td>tarball</td><td>.../pdf-skill-1.2.0.tgz</td></tr>
                    <tr><td>integrity</td><td>sha512-...</td></tr>
                  </table>
                </div>
              </div>
            </section>
          </div>
        `;
      }

      function renderImport() {
        return `
          <div class="import-grid">
            <section class="card section">
              <div class="section-header">
                <div>
                  <h3>Import Wizard</h3>
                  <p>把 source / target / validate / pack 做成显式步骤，不把发布假装成一步黑盒。</p>
                </div>
              </div>
              <div class="steps">
                <div class="step">1. Source<br /><span style="color: var(--muted);">git · github.com/org/repo?path=skills/pdf</span></div>
                <div class="step">2. Target<br /><span style="color: var(--muted);">@platform.skill/pdf-skill · 1.2.0 · strict=false</span></div>
                <div class="step active">3. Validate<br /><span style="color: var(--muted);">warningDetails + importReport + components</span></div>
                <div class="step">4. Pack / Publish<br /><span style="color: var(--muted);">bundle path + release record</span></div>
              </div>
            </section>
            <section class="card section">
              <div class="section-header">
                <div>
                  <h3>Validation Surface</h3>
                  <p>这个页面是前端差异化重点：既能让用户看懂，又不在浏览器里重写 normalization 逻辑。</p>
                </div>
              </div>
              <div class="inline-kpis">
                <div class="kpi"><strong>${data.importReport.normalized ? "Yes" : "No"}</strong><span>Normalized import</span></div>
                <div class="kpi"><strong>${data.importReport.strictMode ? "Strict" : "Relaxed"}</strong><span>Import mode</span></div>
                <div class="kpi"><strong>${data.importReport.generatedPaths.length}</strong><span>Generated paths</span></div>
              </div>
              <div class="grid-two" style="grid-template-columns: 0.92fr 1.08fr; margin-top: 14px;">
                <div class="card" style="padding: 16px; background: rgba(255,255,255,0.48); box-shadow: none;">
                  <strong>Import summary</strong>
                  <table class="table" style="margin-top: 8px;">
                    <tr><td>source type</td><td>${data.importReport.sourceType}</td></tr>
                    <tr><td>strict mode</td><td>${data.importReport.strictMode}</td></tr>
                    <tr><td>normalized</td><td>${data.importReport.normalized}</td></tr>
                    <tr><td>generated paths</td><td>${data.importReport.generatedPaths.join(", ")}</td></tr>
                    <tr><td>package identity</td><td>${data.importReport.rewrotePackageIdentity ? "rewritten" : "unchanged"}</td></tr>
                  </table>
                </div>
                <div class="stack">
                  ${data.warnings
                    .map(
                      (warning) => `
                        <div class="warning-card">
                          <span class="chip warn">${warning.severity}</span>
                          <h4>${warning.title}</h4>
                          <p>${warning.message}</p>
                          <p style="margin-top: 10px;"><strong>Suggested action:</strong> ${warning.action}</p>
                          <div class="meta" style="margin-top: 10px;"><span class="chip">${warning.code}</span></div>
                        </div>
                      `
                    )
                    .join("")}
                </div>
              </div>
            </section>
          </div>
        `;
      }

      function renderDetail() {
        return `
          <div class="detail-grid">
            <section class="card section">
              <div class="section-header">
                <div>
                  <h3>Skill Detail</h3>
                  <p>主问题不是“这个对象模型怎么定义”，而是“这个 skill 是什么、版本怎么选、现在是否可装”。</p>
                </div>
                <span class="chip accent">@platform.skill/pdf-skill</span>
              </div>
              <div class="card" style="padding: 16px; background: rgba(255,255,255,0.5); box-shadow: none;">
                <strong>PDF Skill</strong>
                <p style="color: var(--muted); margin: 8px 0 0;">OCR + extraction + post-processing workflow</p>
                <div class="meta">
                  <span class="chip accent">sourceType = imported</span>
                  <span class="chip good">skill status = active</span>
                  <span class="chip good">latest version = 1.2.0</span>
                </div>
              </div>
              <div class="section-header" style="margin-top: 18px;">
                <div>
                  <h3>Version Table</h3>
                  <p>点击某个版本进入 version detail，并在右侧看到 install target 与治理摘要。</p>
                </div>
              </div>
              <div class="list">
                ${data.versions
                  .map(
                    (item) => `
                      <div class="list-row">
                        <div class="list-row-head">
                          <strong>${item.version}</strong>
                          <span class="${chipClass(item.status)}">${item.status}</span>
                        </div>
                        <div style="color: var(--muted);">${item.time}</div>
                        <div class="meta">
                          <span class="${chipClass(item.policy)}">${item.policy}</span>
                        </div>
                      </div>
                    `
                  )
                  .join("")}
              </div>
            </section>
            <section class="card section">
              <div class="section-header">
                <div>
                  <h3>Version Context</h3>
                  <p>把 install target、bundle metadata 和治理动作放到同一个上下文面板里。</p>
                </div>
              </div>
              <div class="stack">
                <div class="card" style="padding: 16px; background: rgba(255,255,255,0.56); box-shadow: none;">
                  <strong>Install target</strong>
                  <table class="table">
                    <tr><td>npm registry</td><td>https://npm.internal.example.com</td></tr>
                    <tr><td>tarball</td><td>pdf-skill-1.2.0.tgz</td></tr>
                    <tr><td>integrity</td><td>sha512-...</td></tr>
                    <tr><td>manifestDigest</td><td>sha256:1c65...</td></tr>
                    <tr><td>components</td><td>commands, scripts</td></tr>
                  </table>
                </div>
                <div class="card" style="padding: 16px; background: rgba(255,255,255,0.56); box-shadow: none;">
                  <strong>Publisher actions</strong>
                  <div class="hero-actions" style="margin-top: 12px;">
                    <button class="button primary">Create release record</button>
                    <button class="button secondary">Deprecate</button>
                    <button class="button secondary">Yank</button>
                  </div>
                </div>
              </div>
            </section>
          </div>
        `;
      }

      function renderAudit() {
        return `
          <div class="grid-two">
            <section class="card section">
              <div class="section-header">
                <div>
                  <h3>Governance Timeline</h3>
                  <p>skill-level 和 version-level 变化分开显示，但共享同一个过滤上下文。</p>
                </div>
              </div>
              <div class="timeline">
                ${data.governance
                  .map(
                    (item) => `
                      <div class="timeline-item">
                        <strong>${item.title}</strong>
                        <span>${item.meta}</span>
                      </div>
                    `
                  )
                  .join("")}
              </div>
            </section>
            <section class="card section">
              <div class="section-header">
                <div>
                  <h3>Audit Events</h3>
                  <p>给 operator / 审计看的追溯面板，不跟 warning 混在一起。</p>
                </div>
              </div>
              <div class="list">${data.audit.map(listRow).join("")}</div>
            </section>
          </div>
        `;
      }

      function renderContent(screenKey) {
        switch (screenKey) {
          case "catalog":
            return renderCatalog();
          case "import":
            return renderImport();
          case "detail":
            return renderDetail();
          case "audit":
            return renderAudit();
          case "overview":
          default:
            return renderOverview();
        }
      }

      function render() {
        const { variant, screen } = getState();
        document.body.className = variant.bodyClass;
        const app = document.getElementById("app");

        app.innerHTML = `
          <div class="shell">
            <header class="topbar">
              <div class="brand">
                <div class="brand-mark">SR</div>
                <div>
                  <h1>Skill Registry Console</h1>
                  <p>Registry-first UI prototype grounded in the current Go Catalog + packaging APIs.</p>
                </div>
              </div>
              <nav class="screen-nav">
                ${screens
                  .map(
                    (item) => `
                      <a class="screen-link ${item.key === screen.key ? "active" : ""}" href="?variant=${variant.key}&screen=${item.key}">
                        ${item.label}
                      </a>
                    `
                  )
                  .join("")}
              </nav>
            </header>

            <section class="hero">
              <div class="card hero-copy">
                <span class="eyebrow">${variant.heroEyebrow}</span>
                <h2>${variant.heroTitle}</h2>
                <p>${variant.heroCopy}</p>
                <div class="hero-actions">
                  <button class="button primary">Start import flow</button>
                  <button class="button secondary">Browse catalog</button>
                </div>
              </div>
              <aside class="card hero-side">
                <div class="mini-grid">
                  ${data.stats
                    .map(
                      (item) => `
                        <div class="mini-stat">
                          <strong>${item.value}</strong>
                          <span>${item.label}</span>
                        </div>
                      `
                    )
                    .join("")}
                </div>
              </aside>
            </section>

            <main class="content">
              ${renderContent(screen.key)}
            </main>
          </div>

          <div class="bottom-switcher" role="toolbar" aria-label="Prototype variant switcher">
            <button class="switcher-btn" data-dir="-1" aria-label="Previous variant">←</button>
            <div class="switcher-label">
              <div>${variant.label} — ${variant.name}</div>
              <small>Use ← / → to compare variants</small>
            </div>
            <button class="switcher-btn" data-dir="1" aria-label="Next variant">→</button>
          </div>
        `;

        document.querySelectorAll(".screen-link").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            setParams({ variant: variant.key, screen: event.currentTarget.getAttribute("href").split("screen=")[1] });
          });
        });

        document.querySelectorAll(".switcher-btn").forEach((button) => {
          button.addEventListener("click", () => {
            const direction = Number(button.dataset.dir || "1");
            const currentIndex = variants.findIndex((item) => item.key === variant.key);
            const nextIndex = (currentIndex + direction + variants.length) % variants.length;
            setParams({ variant: variants[nextIndex].key, screen: screen.key });
          });
        });
      }

      document.addEventListener("keydown", (event) => {
        const target = event.target;
        if (
          target instanceof HTMLInputElement ||
          target instanceof HTMLTextAreaElement ||
          (target && target.isContentEditable)
        ) {
          return;
        }
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") {
          return;
        }
        const { variant, screen } = getState();
        const currentIndex = variants.findIndex((item) => item.key === variant.key);
        const delta = event.key === "ArrowLeft" ? -1 : 1;
        const nextIndex = (currentIndex + delta + variants.length) % variants.length;
        setParams({ variant: variants[nextIndex].key, screen: screen.key });
      });

      if (!window.location.search) {
        window.history.replaceState({}, "", "?variant=control&screen=overview");
      }

      render();
    </script>
  </body>
</html>
