openapi: 3.1.0
info:
  title: Agent Skill Registry Catalog API
  version: 2026-05-28
servers:
  - url: /api/v1
paths:
  /audit-events:
    get:
      x-required-roles:
        - reader
        - publisher
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /governance-changes:
    get:
      x-required-roles:
        - reader
        - publisher
      responses:
        '200':
          description: Governance changes
          content:
            application/json:
              schema:
                type: object
  /skills:
    get:
      x-required-roles:
        - reader
        - publisher
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/PackageNameQuery'
        - $ref: '#/components/parameters/SourceTypeQuery'
        - $ref: '#/components/parameters/IncludeRetired'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/SkillsSort'
      responses:
        '200':
          description: Skills
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /skills/search:
    get:
      x-required-roles:
        - reader
        - publisher
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsListResponse'
  /skills/curated:
    get:
      x-required-roles:
        - reader
        - publisher
      responses:
        '200':
          description: Curated skills
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsListResponse'
  /skills/{packageName}:
    get:
      x-required-roles:
        - reader
        - publisher
      parameters:
        - $ref: '#/components/parameters/PackageNamePath'
      responses:
        '200':
          description: Skill detail
          content:
            application/json:
              schema:
                type: object
  /skills/{packageName}/governance-changes:
    post:
      x-required-roles:
        - publisher
      parameters:
        - $ref: '#/components/parameters/PackageNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillGovernanceChangeRequest'
      responses:
        '200':
          description: Governance updated
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /skills/{packageName}/install-target:
    get:
      x-required-roles:
        - reader
        - publisher
      parameters:
        - $ref: '#/components/parameters/PackageNamePath'
        - $ref: '#/components/parameters/VersionQuery'
      responses:
        '200':
          description: Install target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallResolutionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /skills/{packageName}/versions:
    get:
      x-required-roles:
        - reader
        - publisher
      parameters:
        - $ref: '#/components/parameters/PackageNamePath'
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                type: object
  /skills/{packageName}/versions/{version}:
    get:
      x-required-roles:
        - reader
        - publisher
      parameters:
        - $ref: '#/components/parameters/PackageNamePath'
        - $ref: '#/components/parameters/VersionPath'
      responses:
        '200':
          description: Version detail
          content:
            application/json:
              schema:
                type: object
  /skills/{packageName}/versions/{version}/governance-changes:
    post:
      x-required-roles:
        - publisher
      parameters:
        - $ref: '#/components/parameters/PackageNamePath'
        - $ref: '#/components/parameters/VersionPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionGovernanceChangeRequest'
      responses:
        '200':
          description: Version governance updated
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /skills/{packageName}/versions/{version}/release-record:
    put:
      x-required-roles:
        - publisher
      parameters:
        - $ref: '#/components/parameters/PackageNamePath'
        - $ref: '#/components/parameters/VersionPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Release record reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseRecordResponse'
        '201':
          description: Release record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseRecordResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    Q:
      name: q
      in: query
      schema:
        type: string
    PackageNameQuery:
      name: packageName
      in: query
      schema:
        type: string
    SourceTypeQuery:
      name: sourceType
      in: query
      schema:
        type: string
    IncludeRetired:
      name: includeRetired
      in: query
      schema:
        type: boolean
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    SkillsSort:
      name: sort
      in: query
      schema:
        type: string
    PackageNamePath:
      name: packageName
      in: path
      required: true
      schema:
        type: string
    VersionQuery:
      name: version
      in: query
      schema:
        type: string
    VersionPath:
      name: version
      in: path
      required: true
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
    PageInfo:
      type: object
      required:
        - nextCursor
        - hasNextPage
      properties:
        nextCursor:
          type:
            - string
            - 'null'
        hasNextPage:
          type: boolean
    SkillSummary:
      type: object
      required:
        - packageName
        - displayName
        - description
        - sourceType
        - status
        - latestVersion
        - latestVersionStatus
        - updatedAt
      properties:
        packageName:
          type: string
        displayName:
          type: string
        description:
          type: string
        sourceType:
          type: string
        status:
          type: string
        latestVersion:
          type: string
        latestVersionStatus:
          type: string
        updatedAt:
          type: string
          format: date-time
    SkillsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SkillSummary'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    InstallResolutionResponse:
      type: object
      required:
        - packageName
        - version
        - npmRegistry
        - integrity
        - tarballUrl
        - skillManifestDigest
        - versionStatus
      properties:
        packageName:
          type: string
        version:
          type: string
        npmRegistry:
          type: string
        integrity:
          type: string
        tarballUrl:
          type: string
        skillManifestDigest:
          type: string
        versionStatus:
          type: string
    ReleaseRecordResponse:
      type: object
      required:
        - packageName
        - version
        - created
        - idempotentReplay
        - versionStatus
        - installPolicy
      properties:
        packageName:
          type: string
        version:
          type: string
        created:
          type: boolean
        idempotentReplay:
          type: boolean
        versionStatus:
          type: string
        installPolicy:
          type: string
    SkillGovernanceChangeRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - retire
    VersionGovernanceChangeRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - deprecate
            - yank
