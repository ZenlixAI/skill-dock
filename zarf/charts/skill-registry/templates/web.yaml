apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skill-registry.webName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: web
    {{- include "skill-registry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: web
      {{- include "skill-registry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        {{- include "skill-registry.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: skills-web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CATALOG_UPSTREAM
              value: {{ include "skill-registry.catalogUpstream" . | quote }}
            - name: CATALOG_AUTHORIZATION_HEADER
              valueFrom:
                secretKeyRef:
                  name: {{ include "skill-registry.webName" . }}-secrets
                  key: catalog_authorization_header
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skill-registry.webName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skill-registry.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: web
    {{- include "skill-registry.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
