{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skill-registry.postgresName" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skill-registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres_db: {{ .Values.postgres.auth.database | quote }}
  postgres_user: {{ .Values.postgres.auth.user | quote }}
  postgres_password: {{ .Values.postgres.auth.password | quote }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skill-registry.nexusName" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skill-registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  nexus_admin_user: {{ .Values.nexus.admin.user | quote }}
  nexus_admin_password: {{ .Values.nexus.admin.password | quote }}
  nexus_repository_name: {{ .Values.nexus.repositoryName | quote }}
  nexus_enable_anonymous_read: {{ .Values.nexus.enableAnonymousRead | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skill-registry.catalogName" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skill-registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  skill_registry_database_url: {{ include "skill-registry.postgresDatabaseUrl" . | quote }}
  skill_registry_reader_token: {{ .Values.catalog.auth.readerToken | quote }}
  skill_registry_authoring_token: {{ .Values.catalog.auth.authoringToken | quote }}
  skill_registry_publisher_token: {{ .Values.catalog.auth.publisherToken | quote }}
  skill_registry_npm_registry_url: {{ include "skill-registry.internalNpmRegistryUrl" . | quote }}
  skill_registry_public_npm_registry_url: {{ include "skill-registry.publicNpmRegistryUrl" . | quote }}
  {{- if .Values.catalog.auth.authTokensJson }}
  skill_registry_auth_tokens_json: |
{{ .Values.catalog.auth.authTokensJson | default "" | indent 4 }}
  {{- else }}
  skill_registry_auth_tokens_json: ""
  {{- end }}
  skill_registry_session_secret: {{ .Values.catalog.session.secret | quote }}
  skill_registry_session_users_json: |
{{ .Values.catalog.session.usersJson | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skill-registry.webName" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skill-registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  catalog_authorization_header: {{ .Values.web.catalogAuthorizationHeader | quote }}
