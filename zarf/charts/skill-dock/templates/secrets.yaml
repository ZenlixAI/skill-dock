{{- $ns := .Release.Namespace -}}
{{- $catalogSecretName := include "skill-dock.catalogSecretName" . -}}
{{- $siteSecretName := include "skill-dock.siteSecretName" . -}}
{{- $verdaccioSecretName := include "skill-dock.verdaccioSecretName" . -}}
{{- $postgresSecretName := include "skill-dock.postgresSecretName" . -}}

{{- $catalogSecret := lookup "v1" "Secret" $ns $catalogSecretName -}}
{{- $verdaccioSecret := lookup "v1" "Secret" $ns $verdaccioSecretName -}}
{{- $postgresSecret := lookup "v1" "Secret" $ns $postgresSecretName -}}

{{- $useEmbeddedPostgres := eq (include "skill-dock.useEmbeddedPostgres" .) "true" -}}
{{- $useEmbeddedVerdaccio := eq (include "skill-dock.useEmbeddedVerdaccio" .) "true" -}}

{{/* Generated passwords and tokens are reused from the existing release
     Secrets on upgrade. */}}
{{- $postgresPassword := .Values.postgres.auth.password -}}
{{- if not $postgresPassword -}}
{{- $postgresPassword = include "skill-dock.secretFrom" (list $postgresSecret "password") -}}
{{- end -}}

{{- $publisherUser := .Values.verdaccio.auth.publisher.user -}}
{{- $storedPublisherUser := include "skill-dock.secretOptional" (list $verdaccioSecret "publisher-user") -}}
{{- $explicitPublisherPassword := .Values.verdaccio.auth.publisher.password -}}
{{- $storedPublisherPassword := include "skill-dock.secretOptional" (list $verdaccioSecret "publisher-password") -}}
{{- $publisherPassword := $explicitPublisherPassword -}}
{{- if not $publisherPassword -}}
{{- $publisherPassword = $storedPublisherPassword -}}
{{- end -}}
{{- if not $publisherPassword -}}
{{- $publisherPassword = randAlphaNum 40 -}}
{{- end -}}
{{- $publisherUserChanged := and $storedPublisherUser (ne $storedPublisherUser $publisherUser) -}}
{{- $publisherPasswordChanged := and $explicitPublisherPassword (or (not $storedPublisherPassword) (ne $explicitPublisherPassword $storedPublisherPassword)) -}}
{{- $existingHtpasswd := include "skill-dock.secretOptional" (list $verdaccioSecret "htpasswd") -}}
{{- $htpasswd := $existingHtpasswd -}}
{{- if or (not $htpasswd) $publisherUserChanged $publisherPasswordChanged -}}
{{- $htpasswd = printf "%s:%s" $publisherUser (bcrypt $publisherPassword) -}}
{{- end -}}

{{- if not .Values.catalog.existingSecret -}}
{{- $databaseURL := .Values.database.url -}}
{{- if and (not $databaseURL) (not .Values.database.existingSecret) -}}
{{- if $useEmbeddedPostgres -}}
{{- $databaseURL = printf "postgres://%s:%s@%s.%s.svc.cluster.local:%d/%s?sslmode=disable" .Values.postgres.auth.user $postgresPassword (include "skill-dock.postgresName" .) $ns (int .Values.postgres.service.port) .Values.postgres.auth.database -}}
{{- else -}}
{{- fail "database is not configured: set database.url, database.existingSecret, or postgres.enabled=true" -}}
{{- end -}}
{{- end -}}

{{- $artifactURL := include "skill-dock.artifactRepositoryUrl" . -}}
{{- if not $artifactURL -}}
{{- fail "artifact repository is not configured: set artifactRepository.url or verdaccio.enabled=true" -}}
{{- end -}}
{{- $publicArtifactURL := include "skill-dock.publicArtifactRepositoryUrl" . -}}

{{- $readerToken := .Values.catalog.auth.readerToken -}}
{{- if not $readerToken -}}
{{- $readerToken = include "skill-dock.secretFrom" (list $catalogSecret "reader-token") -}}
{{- end -}}
{{- $authoringToken := .Values.catalog.auth.authoringToken -}}
{{- if not $authoringToken -}}
{{- $authoringToken = include "skill-dock.secretFrom" (list $catalogSecret "authoring-token") -}}
{{- end -}}
{{- $publisherToken := .Values.catalog.auth.publisherToken -}}
{{- if not $publisherToken -}}
{{- $publisherToken = include "skill-dock.secretFrom" (list $catalogSecret "publisher-token") -}}
{{- end -}}
{{- $authTokensJSON := .Values.catalog.auth.authTokensJson -}}
{{- if not $authTokensJSON -}}
{{- $authTokensJSON = include "skill-dock.secretOptional" (list $catalogSecret "auth-tokens-json") -}}
{{- end -}}

{{- $artifactReadAuthorization := "" -}}
{{- $artifactPublishAuthorization := "" -}}
{{- if .Values.artifactRepository.url -}}
{{- $artifactReadAuthorization = .Values.artifactRepository.readAuthorization -}}
{{- if not $artifactReadAuthorization -}}
{{- $artifactReadAuthorization = include "skill-dock.secretOptional" (list $catalogSecret "artifact-read-authorization") -}}
{{- end -}}
{{- $artifactPublishAuthorization = .Values.artifactRepository.publishAuthorization -}}
{{- if not $artifactPublishAuthorization -}}
{{- $artifactPublishAuthorization = include "skill-dock.secretOptional" (list $catalogSecret "artifact-publish-authorization") -}}
{{- end -}}
{{- else if $useEmbeddedVerdaccio -}}
{{- $publisherBasic := printf "Basic %s" (printf "%s:%s" $publisherUser $publisherPassword | b64enc) -}}
{{- $artifactPublishAuthorization = $publisherBasic -}}
{{- if not .Values.verdaccio.enableAnonymousRead -}}
{{- $artifactReadAuthorization = $publisherBasic -}}
{{- end -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $catalogSecretName }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/component: catalog
    {{- include "skill-dock.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ $databaseURL | default "" | quote }}
  reader-token: {{ $readerToken | quote }}
  authoring-token: {{ $authoringToken | quote }}
  publisher-token: {{ $publisherToken | quote }}
  artifact-read-url: {{ $artifactURL | quote }}
  artifact-read-authorization: {{ $artifactReadAuthorization | default "" | quote }}
  artifact-publish-authorization: {{ $artifactPublishAuthorization | default "" | quote }}
  public-install-url: {{ $publicArtifactURL | quote }}
  auth-tokens-json: {{ $authTokensJSON | default "" | quote }}
{{- end }}
{{- if not .Values.site.existingSecret }}

---

apiVersion: v1
kind: Secret
metadata:
  name: {{ $siteSecretName }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/component: site
    {{- include "skill-dock.labels" . | nindent 4 }}
type: Opaque
stringData:
  catalog-authorization-header: {{ .Values.site.catalogAuthorizationHeader | quote }}
{{- end }}
{{- if $useEmbeddedVerdaccio }}

---

apiVersion: v1
kind: Secret
metadata:
  name: {{ $verdaccioSecretName }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/component: verdaccio
    {{- include "skill-dock.labels" . | nindent 4 }}
type: Opaque
stringData:
  htpasswd: {{ $htpasswd | quote }}
  publisher-user: {{ $publisherUser | quote }}
  publisher-password: {{ $publisherPassword | quote }}
{{- end }}
{{- if $useEmbeddedPostgres }}

---

apiVersion: v1
kind: Secret
metadata:
  name: {{ $postgresSecretName }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/component: postgres
    {{- include "skill-dock.labels" . | nindent 4 }}
type: Opaque
stringData:
  database: {{ .Values.postgres.auth.database | quote }}
  user: {{ .Values.postgres.auth.user | quote }}
  password: {{ $postgresPassword | quote }}
{{- end }}
