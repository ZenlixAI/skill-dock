apiVersion: v1
kind: Namespace
metadata:
  name: skill-registry
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: skill-registry
type: Opaque
stringData:
  postgres_db: skill_registry
  postgres_user: skill_registry
  postgres_password: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
  namespace: skill-registry
type: Opaque
stringData:
  nexus_admin_user: admin
  nexus_admin_password: change-me
  nexus_repository_name: skills-npm
  nexus_enable_anonymous_read: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: skill-registry
type: Opaque
stringData:
  skill_registry_database_url: postgres://skill_registry:change-me@postgres.skill-registry.svc.cluster.local:5432/skill_registry?sslmode=disable
  skill_registry_reader_token: replace-reader-token
  skill_registry_authoring_token: replace-authoring-token
  skill_registry_publisher_token: replace-publisher-token
  # Internal URL used by Catalog pods to read npm metadata and tarballs.
  skill_registry_npm_registry_url: http://nexus.skill-registry.svc.cluster.local:8081/repository/skills-npm/
  # External URL returned to CLI clients for publish/install flows.
  skill_registry_public_npm_registry_url: https://nexus.example.com/repository/skills-npm/
  skill_registry_auth_tokens_json: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: web-secrets
  namespace: skill-registry
type: Opaque
stringData:
  # Keep the web layer read-only by default.
  catalog_authorization_header: Bearer replace-reader-token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-bootstrap
  namespace: skill-registry
data:
  bootstrap.sh: |
    #!/bin/bash
    set -euo pipefail

    NEXUS_URL="${NEXUS_URL:-http://127.0.0.1:8081}"
    NEXUS_DATA_DIR="${NEXUS_DATA_DIR:-/nexus-data}"
    ADMIN_USER="${NEXUS_ADMIN_USER:-admin}"
    ADMIN_PASSWORD="${NEXUS_ADMIN_PASSWORD:-admin123456}"
    REPOSITORY_NAME="${NEXUS_REPOSITORY_NAME:-skills-npm}"
    ENABLE_ANONYMOUS_READ="${NEXUS_ENABLE_ANONYMOUS_READ:-true}"
    BOOTSTRAP_MARKER="${NEXUS_DATA_DIR}/.skills-registry-bootstrap-complete"

    apt-get update >/dev/null
    apt-get install -y curl jq >/dev/null

    until curl -fsS "${NEXUS_URL}/service/rest/v1/status" >/dev/null 2>&1; do
      sleep 5
    done

    current_auth="${ADMIN_USER}:${ADMIN_PASSWORD}"
    if ! curl -fsS -u "${current_auth}" "${NEXUS_URL}/service/rest/v1/repositories" >/dev/null 2>&1; then
      if [[ ! -f "${NEXUS_DATA_DIR}/admin.password" ]]; then
        echo "Missing Nexus initial admin password file at ${NEXUS_DATA_DIR}/admin.password" >&2
        exit 1
      fi
      initial_password="$(tr -d '\r\n' < "${NEXUS_DATA_DIR}/admin.password")"
      initial_auth="${ADMIN_USER}:${initial_password}"
      curl -fsS -u "${initial_auth}" \
        -X PUT \
        -H 'Content-Type: text/plain' \
        --data "${ADMIN_PASSWORD}" \
        "${NEXUS_URL}/service/rest/v1/security/users/${ADMIN_USER}/change-password" >/dev/null
      current_auth="${ADMIN_USER}:${ADMIN_PASSWORD}"
    fi

    active_realms="$(curl -fsS -u "${current_auth}" "${NEXUS_URL}/service/rest/v1/security/realms/active")"
    if ! printf '%s' "${active_realms}" | jq -e '.[] | select(. == "NpmToken")' >/dev/null; then
      updated_realms="$(printf '%s' "${active_realms}" | jq -c '["NpmToken"] + .')"
      curl -fsS -u "${current_auth}" \
        -X PUT \
        -H 'Content-Type: application/json' \
        --data "${updated_realms}" \
        "${NEXUS_URL}/service/rest/v1/security/realms/active" >/dev/null
    fi

    curl -fsS -u "${current_auth}" \
      -X POST \
      -H 'Content-Type: application/json' \
      --data '{"accepted":true}' \
      "${NEXUS_URL}/service/rest/v1/system/eula" >/dev/null || true

    anonymous_payload="$(jq -nc \
      --argjson enabled "$([[ "${ENABLE_ANONYMOUS_READ}" == "true" ]] && echo true || echo false)" \
      '{enabled:$enabled,userId:"anonymous",realmName:"NexusAuthorizingRealm"}')"
    curl -fsS -u "${current_auth}" \
      -X PUT \
      -H 'Content-Type: application/json' \
      --data "${anonymous_payload}" \
      "${NEXUS_URL}/service/rest/v1/security/anonymous" >/dev/null

    repositories="$(curl -fsS -u "${current_auth}" "${NEXUS_URL}/service/rest/v1/repositories")"
    if ! printf '%s' "${repositories}" | jq -e --arg name "${REPOSITORY_NAME}" '.[] | select(.name == $name)' >/dev/null; then
      repository_payload="$(jq -nc \
        --arg name "${REPOSITORY_NAME}" \
        '{name:$name,online:true,storage:{blobStoreName:"default",strictContentTypeValidation:true,writePolicy:"ALLOW_ONCE"}}')"
      curl -fsS -u "${current_auth}" \
        -X POST \
        -H 'Content-Type: application/json' \
        --data "${repository_payload}" \
        "${NEXUS_URL}/service/rest/v1/repositories/npm/hosted" >/dev/null
    fi

    touch "${BOOTSTRAP_MARKER}"
    echo "Nexus bootstrap complete for repository ${REPOSITORY_NAME}"
    exec tail -f /dev/null
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: skill-registry
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: skill-registry
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres_password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: skill-registry
spec:
  selector:
    app: nexus
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nexus
  namespace: skill-registry
spec:
  serviceName: nexus
  replicas: 1
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      securityContext:
        fsGroup: 200
      containers:
        - name: nexus
          image: sonatype/nexus3:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: INSTALL4J_ADD_VM_PARAMS
              value: >-
                -Xms1024m -Xmx1024m -XX:MaxDirectMemorySize=1024m
                -Djava.util.prefs.userRoot=/nexus-data/javaprefs
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
          readinessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
        - name: nexus-bootstrap
          image: node:22-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /bootstrap/bootstrap.sh
          env:
            - name: NEXUS_URL
              value: http://127.0.0.1:8081
            - name: NEXUS_DATA_DIR
              value: /nexus-data
            - name: NEXUS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: nexus_admin_user
            - name: NEXUS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: nexus_admin_password
            - name: NEXUS_REPOSITORY_NAME
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: nexus_repository_name
            - name: NEXUS_ENABLE_ANONYMOUS_READ
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: nexus_enable_anonymous_read
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
            - name: nexus-bootstrap
              mountPath: /bootstrap
      volumes:
        - name: nexus-bootstrap
          configMap:
            name: nexus-bootstrap
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: nexus-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: skill-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: registry.example.com/skill-registry-catalog:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SKILL_REGISTRY_ADDR
              value: ":8080"
            - name: SKILL_REGISTRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_database_url
            - name: SKILL_REGISTRY_READER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_reader_token
            - name: SKILL_REGISTRY_AUTHORING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_authoring_token
            - name: SKILL_REGISTRY_PUBLISHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_publisher_token
            - name: SKILL_REGISTRY_NPM_REGISTRY_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_npm_registry_url
            - name: SKILL_REGISTRY_PUBLIC_NPM_REGISTRY_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_public_npm_registry_url
            - name: SKILL_REGISTRY_AUTH_TOKENS_JSON
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_auth_tokens_json
            - name: SKILL_REGISTRY_ENABLE_SAMPLE_DATA
              value: "false"
            - name: SKILL_REGISTRY_ENABLE_MOCK_REGISTRY
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: skill-registry
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skills-web
  namespace: skill-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skills-web
  template:
    metadata:
      labels:
        app: skills-web
    spec:
      containers:
        - name: skills-web
          image: registry.example.com/skill-registry-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CATALOG_UPSTREAM
              value: http://catalog.skill-registry.svc.cluster.local:8080
            - name: CATALOG_AUTHORIZATION_HEADER
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: catalog_authorization_header
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: skills-web
  namespace: skill-registry
spec:
  selector:
    app: skills-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skills-web
  namespace: skill-registry
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: skills.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skills-web
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus
  namespace: skill-registry
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: nexus.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus
                port:
                  number: 8081
