apiVersion: v1
kind: Namespace
metadata:
  name: skill-registry
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: skill-registry
type: Opaque
stringData:
  postgres_db: skill_registry
  postgres_user: skill_registry
  postgres_password: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
  namespace: skill-registry
type: Opaque
stringData:
  nexus_admin_user: admin
  nexus_admin_password: change-me
  nexus_repository_name: skills-npm
  nexus_enable_anonymous_read: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: skill-registry
type: Opaque
stringData:
  skill_registry_database_url: postgres://skill_registry:change-me@postgres.skill-registry.svc.cluster.local:5432/skill_registry?sslmode=disable
  skill_registry_reader_token: replace-reader-token
  skill_registry_authoring_token: replace-authoring-token
  skill_registry_publisher_token: replace-publisher-token
  # Internal URL used by Catalog pods to read npm metadata and tarballs.
  skill_registry_npm_registry_url: http://nexus.skill-registry.svc.cluster.local:8081/repository/skills-npm/
  # Required only when the web "发布 skill" action should let Catalog publish directly to Nexus.
  skill_registry_npm_publish_authorization: Bearer replace-nexus-publish-token
  # External URL returned to CLI clients for publish/install flows.
  skill_registry_public_npm_registry_url: https://skills.example.com/repository/skills-npm/
  skill_registry_auth_tokens_json: ""
  # Required when the web side should support browser login / switch user / logout.
  skill_registry_session_secret: replace-session-secret
  skill_registry_session_users_json: |
    {
      "reader": {
        "password": "replace-reader-password",
        "role": "reader",
        "actor": "reader"
      },
      "operator": {
        "password": "replace-operator-password",
        "role": "operator",
        "actor": "operator"
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: web-secrets
  namespace: skill-registry
type: Opaque
stringData:
  # Leave empty when browser login / session-cookie mode is enabled.
  catalog_authorization_header: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-bootstrap
  namespace: skill-registry
data:
  bootstrap.sh: |
    #!/bin/bash
    set -euo pipefail

    exec node /bootstrap/bootstrap.mjs
  bootstrap.mjs: |
    import { readFile, unlink, writeFile } from 'node:fs/promises';

    const nexusUrl = process.env.NEXUS_URL || 'http://127.0.0.1:8081';
    const dataDir = process.env.NEXUS_DATA_DIR || '/nexus-data';
    const adminUser = process.env.NEXUS_ADMIN_USER || 'admin';
    const adminPassword = process.env.NEXUS_ADMIN_PASSWORD || 'admin123456';
    const repositoryName = process.env.NEXUS_REPOSITORY_NAME || 'skills-npm';
    const anonymousRead = process.env.NEXUS_ENABLE_ANONYMOUS_READ === 'true';
    const marker = `${dataDir}/.skills-registry-bootstrap-ready`;

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const authHeader = (user, password) => `Basic ${Buffer.from(`${user}:${password}`).toString('base64')}`;
    async function request(path, { user = adminUser, password = adminPassword, method = 'GET', body, headers = {} } = {}) {
      const requestBody = body === undefined ? undefined : typeof body === 'string' ? body : JSON.stringify(body);
      const response = await fetch(`${nexusUrl}${path}`, {
        method,
        headers: { Authorization: authHeader(user, password), ...(requestBody === undefined ? {} : { 'Content-Type': 'application/json' }), ...headers },
        body: requestBody,
      });
      const text = await response.text();
      let data = text;
      try { data = text ? JSON.parse(text) : null; } catch { /* plain text response */ }
      return { ok: response.ok, status: response.status, data };
    }
    async function waitForNexus() {
      for (;;) {
        try { if ((await fetch(`${nexusUrl}/service/rest/v1/status`)).ok) return; } catch { /* starting */ }
        console.log(`waiting for Nexus at ${nexusUrl}`);
        await sleep(5000);
      }
    }
    async function fail(response, operation) {
      if (!response.ok) throw new Error(`${operation} failed with HTTP ${response.status}: ${JSON.stringify(response.data)}`);
    }

    await unlink(marker).catch(() => {});
    await waitForNexus();
    let currentPassword = adminPassword;
    let repositories;
    let initialPasswordAttempts = 0;
    let passwordChangeSucceeded = false;
    for (let attempt = 1; attempt <= 60; attempt += 1) {
      repositories = await request('/service/rest/v1/repositories');
      if (repositories.ok) break;
      if (!passwordChangeSucceeded && initialPasswordAttempts < 3) try {
        initialPasswordAttempts += 1;
        const initialPassword = (await readFile(`${dataDir}/admin.password`, 'utf8')).trim();
        const changed = await request(`/service/rest/v1/security/users/${encodeURIComponent(adminUser)}/change-password`, {
          user: adminUser, password: initialPassword, method: 'PUT', body: adminPassword, headers: { 'Content-Type': 'text/plain' },
        });
        if (changed.ok) {
          passwordChangeSucceeded = true;
          repositories = await request('/service/rest/v1/repositories');
          if (repositories.ok) break;
        }
      } catch { /* Nexus security may still be initializing */ }
      console.log(`waiting for Nexus authentication (attempt ${attempt}/60)`);
      await sleep(5000);
    }
    await fail(repositories, 'List Nexus repositories');
    const realmsResponse = await request('/service/rest/v1/security/realms/active');
    await fail(realmsResponse, 'Read Nexus realms');
    const realms = Array.isArray(realmsResponse.data) ? realmsResponse.data : [];
    if (!realms.includes('NpmToken')) await fail(await request('/service/rest/v1/security/realms/active', { method: 'PUT', body: ['NpmToken', ...realms] }), 'Enable Nexus NpmToken realm');
    await fail(await request('/service/rest/v1/system/eula', { method: 'POST', body: { accepted: true } }), 'Accept Nexus EULA');
    const eulaState = await request('/service/rest/v1/system/eula');
    await fail(eulaState, 'Read Nexus EULA');
    if (eulaState.data?.accepted !== true) throw new Error('Nexus EULA acceptance did not persist');
    await fail(await request('/service/rest/v1/security/anonymous', { method: 'PUT', body: { enabled: anonymousRead, userId: 'anonymous', realmName: 'NexusAuthorizingRealm' } }), 'Configure Nexus anonymous access');
    const repository = repositories.data?.find?.(({ name }) => name === repositoryName);
    const payload = { name: repositoryName, online: true, storage: { blobStoreName: 'default', strictContentTypeValidation: true, writePolicy: 'ALLOW' }, component: { proprietaryComponents: false } };
    if (!repository) await fail(await request('/service/rest/v1/repositories/npm/hosted', { method: 'POST', body: payload }), `Create Nexus repository ${repositoryName}`);
    else if (repository.storage?.writePolicy !== 'ALLOW') await fail(await request(`/service/rest/v1/repositories/npm/hosted/${encodeURIComponent(repositoryName)}`, { method: 'PUT', body: payload }), `Update Nexus repository ${repositoryName}`);
    await writeFile(marker, 'ready\n');
    console.log(`Nexus bootstrap complete for repository ${repositoryName}`);
    for (;;) await sleep(60_000);
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: skill-registry
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: skill-registry
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres_password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: skill-registry
spec:
  selector:
    app: nexus
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nexus
  namespace: skill-registry
spec:
  serviceName: nexus
  replicas: 1
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      securityContext:
        fsGroup: 200
      containers:
        - name: nexus
          image: sonatype/nexus3:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: INSTALL4J_ADD_VM_PARAMS
              value: >-
                -Xms1024m -Xmx1024m -XX:MaxDirectMemorySize=1024m
                -Djava.util.prefs.userRoot=/nexus-data/javaprefs
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
          readinessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
        - name: nexus-bootstrap
          image: node:22-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /bootstrap/bootstrap.sh
          env:
            - name: NEXUS_URL
              value: http://127.0.0.1:8081
            - name: NEXUS_DATA_DIR
              value: /nexus-data
            - name: NEXUS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: nexus_admin_user
            - name: NEXUS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: nexus_admin_password
            - name: NEXUS_REPOSITORY_NAME
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: nexus_repository_name
            - name: NEXUS_ENABLE_ANONYMOUS_READ
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: nexus_enable_anonymous_read
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
            - name: nexus-bootstrap
              mountPath: /bootstrap
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /nexus-data/.skills-registry-bootstrap-ready
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
      volumes:
        - name: nexus-bootstrap
          configMap:
            name: nexus-bootstrap
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: nexus-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: skill-registry
spec:
  # Packaging workspaces live on the Catalog pod local filesystem, so
  # prepare/validate/pack flows currently require a single Catalog replica.
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: registry.example.com/skill-registry-catalog:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SKILL_REGISTRY_ADDR
              value: ":8080"
            - name: SKILL_REGISTRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_database_url
            - name: SKILL_REGISTRY_READER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_reader_token
            - name: SKILL_REGISTRY_AUTHORING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_authoring_token
            - name: SKILL_REGISTRY_PUBLISHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_publisher_token
            - name: SKILL_REGISTRY_NPM_REGISTRY_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_npm_registry_url
            - name: SKILL_REGISTRY_NPM_PUBLISH_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_npm_publish_authorization
            - name: SKILL_REGISTRY_PUBLIC_NPM_REGISTRY_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_public_npm_registry_url
            - name: SKILL_REGISTRY_AUTH_TOKENS_JSON
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_auth_tokens_json
            - name: SKILL_REGISTRY_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_session_secret
            - name: SKILL_REGISTRY_SESSION_USERS_JSON
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_session_users_json
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: skill-registry
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skills-web
  namespace: skill-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skills-web
  template:
    metadata:
      labels:
        app: skills-web
    spec:
      containers:
        - name: skills-web
          image: registry.example.com/skill-registry-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CATALOG_UPSTREAM
              value: http://catalog.skill-registry.svc.cluster.local:8080
            - name: CATALOG_AUTHORIZATION_HEADER
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: catalog_authorization_header
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: skills-web
  namespace: skill-registry
spec:
  selector:
    app: skills-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skills-web
  namespace: skill-registry
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: skills.example.com
      http:
        paths:
          - path: /repository/skills-npm
            pathType: Prefix
            backend:
              service:
                name: nexus
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skills-web
                port:
                  number: 8080
