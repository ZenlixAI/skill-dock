apiVersion: v1
kind: Namespace
metadata:
  name: skill-registry
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: skill-registry
type: Opaque
stringData:
  skill_registry_database_url: postgres://skill_registry:skill_registry@postgres:5432/skill_registry?sslmode=disable
  skill_registry_reader_token: reader-secret
  skill_registry_authoring_token: authoring-secret
  skill_registry_publisher_token: publisher-secret
  skill_registry_artifact_read_url: http://host.docker.internal:30080/
  skill_registry_artifact_read_authorization: ""
  skill_registry_artifact_publish_authorization: ""
  skill_registry_npm_read_authorization: ""
  skill_registry_npm_publish_authorization: ""
  skill_registry_public_install_url: http://127.0.0.1:18080/repository/skills-npm/
  skill_registry_auth_tokens_json: ""
  skill_registry_session_secret: local-kind-session-secret
  skill_registry_session_users_json: |
    {
      "reader": {
        "password": "reader-secret",
        "role": "reader",
        "actor": "reader"
      },
      "operator": {
        "password": "op-secret",
        "role": "operator",
        "actor": "operator"
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: web-secrets
  namespace: skill-registry
type: Opaque
stringData:
  catalog_authorization_header: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: skill-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: skill_registry
            - name: POSTGRES_USER
              value: skill_registry
            - name: POSTGRES_PASSWORD
              value: skill_registry
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - skill_registry
                - -d
                - skill_registry
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: skill-registry
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: skill-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: skill-registry-catalog:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SKILL_REGISTRY_ADDR
              value: ":8080"
            - name: SKILL_REGISTRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_database_url
            - name: SKILL_REGISTRY_READER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_reader_token
            - name: SKILL_REGISTRY_AUTHORING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_authoring_token
            - name: SKILL_REGISTRY_PUBLISHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_publisher_token
            - name: SKILL_REGISTRY_DISABLE_SEED
              value: "false"
            - name: SKILL_REGISTRY_ARTIFACT_READ_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_artifact_read_url
            - name: SKILL_REGISTRY_ARTIFACT_READ_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_artifact_read_authorization
            - name: SKILL_REGISTRY_ARTIFACT_PUBLISH_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_artifact_publish_authorization
            - name: SKILL_REGISTRY_PUBLIC_INSTALL_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_public_install_url
            - name: SKILL_REGISTRY_AUTH_TOKENS_JSON
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_auth_tokens_json
            - name: SKILL_REGISTRY_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_session_secret
            - name: SKILL_REGISTRY_SESSION_USERS_JSON
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: skill_registry_session_users_json
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: skill-registry
spec:
  type: NodePort
  selector:
    app: catalog
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skills-web
  namespace: skill-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skills-web
  template:
    metadata:
      labels:
        app: skills-web
    spec:
      containers:
        - name: skills-web
          image: skill-registry-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CATALOG_UPSTREAM
              value: http://catalog.skill-registry.svc.cluster.local:8080
            - name: CATALOG_AUTHORIZATION_HEADER
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: catalog_authorization_header
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: skills-web
  namespace: skill-registry
spec:
  type: NodePort
  selector:
    app: skills-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
