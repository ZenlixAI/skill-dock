    <link rel="canonical" href="https://skill-dock.pages.dev/" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('skill-dock-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#070908' : '#f6f8f4');
          });
        } catch (error) {}
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://skill-dock.pages.dev/#website",
            "url": "https://skill-dock.pages.dev/",
            "name": "Skill Dock",
            "description": "A self-hosted registry for agent skills.",

          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://skill-dock.pages.dev/#software",
            "name": "Skill Dock",
            "url": "https://skill-dock.pages.dev/",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Linux, macOS, Windows",
            "description": "Skill Dock stores agent skill bundles in your npm registry, publishes exact versions, resolves installs, and governs releases.",
            "license": "https://github.com/ZenlixAI/skill-dock/blob/master/LICENSE",
            "isAccessibleForFree": true,
            "sameAs": ["https://github.com/ZenlixAI/skill-dock"]
          },
          {
            "@type": "FAQPage",
            "@id": "https://skill-dock.pages.dev/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Does Skill Dock store the bundle?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Skill Dock stores release metadata and resolves tarball URLs. The bundle bytes stay in your npm registry."
                }
              },
              {
                "@type": "Question",
                "name": "Which npm registries work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Any registry that supports the npm publish and package metadata APIs. Teams commonly use Nexus, Artifactory, or Verdaccio. The local Compose stack includes Verdaccio for evaluation."
                }
              },
              {
                "@type": "Question",
                "name": "Can developers keep installing from git?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. skills add accepts a local path, a GitHub shorthand, or a git URL. skills sync refreshes those installs. Registry installs use skills update."
                }
              },
              {
                "@type": "Question",
                "name": "What happens when a version is yanked?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The tarball stays in npm. Skill Dock marks the version yanked and blocked. New installs fail with an explicit error, and the response can include a replacement recommendation."
                }
              },
              {
                "@type": "Question",
                "name": "How do I run it in production?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Run the catalog with Postgres, point SKILL_REGISTRY_ARTIFACT_READ_URL at your npm registry, and put the catalog behind TLS. The production Compose file is in zarf/compose/production.yml."
                }
              }
            ]
          }
        ]
      }
    </script>
